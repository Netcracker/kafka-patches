# .github/workflows/qb-build-kafka.yml
name: Build .tgz for Apache Kafka
run-name: |
  Kafka: ${{ inputs.kafka-tag || '4.1.1' }} |
  Release tag: ${{ inputs.tag || 'kafka-4.1.1-patched' }} |
  Qubership-kafka target branch: ${{ inputs.target-ref || 'main' }}

on:
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch:
    inputs:
      kafka-tag:
        description: "Kafka tag to build"
        required: true
        default: "4.1.1"
      tag:
        description: "Tag to create (default: kafka-4.1.1-patched)"
        required: false
        default: "kafka-4.1.1-patched"
      forceCreate:
        type: boolean
        description: "Override tag name (default: true)"
        required: false
        default: true
      scalaVersion:
        description: "Scala version to use (default: 2.13.16)"
        required: false
        default: "2.13.16"
      javaVersion:
        description: "Java version to use (default: 17)"
        required: false
        default: "17"
      target-ref:
        description: "Target branch in qubership-kafka repo (default: main)"
        required: true
        default: "main"
      replace-symbol:
        description: "Symbol to change '/' in ref name to"
        required: true
        default: "_"
        
permissions:
  contents: read

env:
  KAFKA_TAG: ${{ inputs.kafka-tag || '4.1.1' }}
  TAG: ${{ inputs.tag || 'kafka-4.1.1-patched' }}
  FORCE_CREATE: ${{ inputs.forceCreate || 'true' }}
  SCALA_VERSION: ${{ inputs.scalaVersion || '2.13.16' }}
  JAVA_VERSION: ${{ inputs.javaVersion || '17' }}
  TARGET_REF: ${{ inputs.target-ref || 'main' }}
  REPLACE_SYMBOL: ${{ inputs.replace-symbol || '_' }}
jobs:
  build:
    permissions:
      contents: write
      actions: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create a New Tag
        uses: netcracker/qubership-workflow-hub/actions/tag-action@8d542a426ce561c7dce745f6b9cee068d1d7e101 #2.0.10
        with:
          ref: ${{ github.ref_name }}
          tag-name: ${{ inputs.tag }}
          force-create: ${{ inputs.forceCreate }}
          switch-to-tag: true
          create-release: true
          draft-release: false
          skip-checkout: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        run: |
          rm -rf ./*

      - name: Checkout kafka tag ${{ inputs.kafka-tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: apache/kafka
          ref: ${{ inputs.kafka-tag }}

      - name: Checkout kafka-patches tag ${{ inputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          path: kafka-patches

      - name: Apply patches
        run: |
          cd ${GITHUB_WORKSPACE}
          for p in ./kafka-patches/kafka-patches/${{ inputs.kafka-tag }}/*.patch; do
            echo "Applying $p…"
            git apply -p1 --ignore-space-change --ignore-whitespace "$p"
          done
          rm -rf ./kafka-patches

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.javaVersion }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build and test (skip Spotless and RAT)
        run: |
          ./gradlew clean -x spotlessCheck -x rat -x test check releaseTarGz \
            -PscalaVersion=${{ inputs.scalaVersion }} \
            --warning-mode all \
            --stacktrace

      - name: Upload Kafka distribution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-distribution
          path: core/build/distributions/*.tgz

      - name: "Upload assets"
        uses: netcracker/qubership-workflow-hub/actions/assets-action@8d542a426ce561c7dce745f6b9cee068d1d7e101 #2.0.10
        with:
          tag: ${{ inputs.tag }}
          item-path: core/build/distributions/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test/

      - name: Get kafka distribution artifact
        run: |
          KAFKA_DISTRO=$(find core/build/distributions/ -regextype posix-extended -regex '.*/kafka_[0-9.-]+\.tgz' | head -n 1 | xargs -I {} basename {})
          if [ -f "core/build/distributions/$KAFKA_DISTRO" ]; then
            echo "Found Kafka distribution: $KAFKA_DISTRO"
            echo "KAFKA_DISTRO=$KAFKA_DISTRO" >> $GITHUB_ENV
          else
            echo "Kafka distribution not found!"
            exit 1
          fi
      - name: Trigger Qubership Kafka Docker Build
        uses: netcracker/qubership-workflow-hub/actions/custom-event@8d542a426ce561c7dce745f6b9cee068d1d7e101 #2.0.10
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          owner: ${{ github.repository_owner }}
          repo: qubership-kafka
          event-type: kafka-patched-build
          client-payload: '{"kafka-version": "${{ inputs.kafka-tag }}", "scala-version": "${{ inputs.scalaVersion }}", "javaVersion": "${{ inputs.javaVersion }}", "kafka-distro": "${{ env.KAFKA_DISTRO }}", "kafka-distro-url": "https://github.com/${{ github.repository_owner }}/kafka-patches/releases/download/${{ inputs.tag }}/${{ env.KAFKA_DISTRO }}", "target-ref": "${{ inputs.target-ref }}", "replace-symbol": "${{ inputs.replace-symbol }}", "tag": "${{ inputs.tag }}", "repo":"${{ github.repository }}"}'




